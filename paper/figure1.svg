<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Malgun Gothic, AppleGothic, sans-serif">
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">그림 1. AI의 MBTI 판정 일관성</text>

  <!-- Panel A: 세션 간 일관성 -->
  <text x="40" y="66" font-size="14" font-weight="700" fill="#1a1a1a">(A) 세션 간 일관성 — 글별 15회 중 최빈유형 비율</text>
  <!-- axis -->
  <line x1="60" y1="210" x2="360" y2="210" stroke="#999" stroke-width="1"/>
  <line x1="60" y1="90" x2="60" y2="210" stroke="#999" stroke-width="1"/>
  <text x="52" y="94" text-anchor="end" font-size="10" fill="#666">100%</text>
  <text x="52" y="213" text-anchor="end" font-size="10" fill="#666">0%</text>
  <!-- bars: all 100% -->
  <g fill="#3b6fd4">
    <rect x="80" y="90" width="40" height="120"/>
    <rect x="150" y="90" width="40" height="120"/>
    <rect x="220" y="90" width="40" height="120"/>
    <rect x="290" y="90" width="40" height="120"/>
  </g>
  <g font-size="11" fill="#1a1a1a" text-anchor="middle">
    <text x="100" y="226">T1 취미</text>
    <text x="170" y="226">T2 계획</text>
    <text x="240" y="226">T3 봉준호</text>
    <text x="310" y="226">T4 RM</text>
    <text x="100" y="84" font-weight="700">100%</text>
    <text x="170" y="84" font-weight="700">100%</text>
    <text x="240" y="84" font-weight="700">100%</text>
    <text x="310" y="84" font-weight="700">100%</text>
  </g>
  <text x="60" y="250" font-size="11" fill="#555">→ 동일 입력 반복 시 판정은 전혀 흔들리지 않음(15/15 동일).</text>

  <!-- Panel B: 주제 민감성 -->
  <text x="420" y="66" font-size="14" font-weight="700" fill="#1a1a1a">(B) 주제 민감성 — 같은 저자 T1 vs T2</text>
  <g font-size="12">
    <text x="440" y="100" font-size="11" fill="#666">축</text>
    <text x="540" y="100" font-size="11" fill="#666" text-anchor="middle">T1(취미)</text>
    <text x="650" y="100" font-size="11" fill="#666" text-anchor="middle">T2(계획)</text>

    <!-- EI -->
    <text x="440" y="128" fill="#1a1a1a">E / I</text>
    <text x="540" y="128" text-anchor="middle" fill="#2e7d32">I</text>
    <text x="650" y="128" text-anchor="middle" fill="#2e7d32">I</text>
    <text x="710" y="128" font-size="10" fill="#2e7d32">동일</text>
    <!-- SN -->
    <text x="440" y="156" fill="#1a1a1a">S / N</text>
    <text x="540" y="156" text-anchor="middle" fill="#2e7d32">S</text>
    <text x="650" y="156" text-anchor="middle" fill="#2e7d32">S</text>
    <text x="710" y="156" font-size="10" fill="#2e7d32">동일</text>
    <!-- TF flip -->
    <rect x="420" y="168" width="320" height="26" fill="#fdecea"/>
    <text x="440" y="186" fill="#1a1a1a">T / F</text>
    <text x="540" y="186" text-anchor="middle" font-weight="700" fill="#c0392b">F</text>
    <text x="650" y="186" text-anchor="middle" font-weight="700" fill="#c0392b">T</text>
    <text x="710" y="186" font-size="10" fill="#c0392b">뒤집힘</text>
    <!-- JP flip -->
    <rect x="420" y="196" width="320" height="26" fill="#fdecea"/>
    <text x="440" y="214" fill="#1a1a1a">J / P</text>
    <text x="540" y="214" text-anchor="middle" font-weight="700" fill="#c0392b">P</text>
    <text x="650" y="214" text-anchor="middle" font-weight="700" fill="#c0392b">J</text>
    <text x="710" y="214" font-size="10" fill="#c0392b">뒤집힘</text>
  </g>
  <text x="420" y="250" font-size="12" fill="#1a1a1a">결과: ISFP → ISTJ (4개 중 2개 축 변화)</text>
  <text x="420" y="268" font-size="11" fill="#555">→ 같은 사람이라도 글 주제가 바뀌면 유형이 달라짐.</text>

  <!-- bottom note -->
  <line x1="40" y1="300" x2="720" y2="300" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="324" font-size="11" fill="#444" font-weight="700">요약</text>
  <text x="40" y="344" font-size="11" fill="#444">· 변동은 "반복"이 아니라 "입력 내용"에서 발생한다. (반복 변동 0% vs 주제 변경 시 2축 변화)</text>
  <text x="40" y="362" font-size="11" fill="#444">· 즉 글 기반 MBTI는 글쓴이의 안정적 속성이 아니라 그 글의 주제·어조를 반영한다.</text>
  <text x="40" y="392" font-size="10" fill="#888">n=15 독립 세션 × 4개 글 = 60 판정. 모델: Claude Sonnet(서브에이전트). 날짜: 2026-10-16. ※반복 변동 0%는 결정론적 디코딩의 영향일 수 있음(한계 참조).</text>
</svg>
